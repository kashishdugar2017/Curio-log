{% extends 'learning_logs/base.html' %}

{% block content %}

<p>Edit entry:</p>

<p>Topic: {{ topic.text }}</p>

    {% csrf_token %}
    {{ form.as_div }}
    <button name="submit">Save changes</button>
</form>

{% endblock content %}
