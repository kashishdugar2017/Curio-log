{% extends 'learning_logs/base.html' %}

{% block content %}

<div class="p-5 mb-4 bg-light rounded-3">

    <div class="container-fluid py-5">

        <h1 class="display-3">
            Welcome to Curio Log!
        </h1>

        <p class="lead">
            Explore your curiosities, record your discoveries,
            and keep track of everything you learn.
        </p>

        {% if user.is_authenticated %}

            <a class="btn btn-primary btn-lg"
               href="{% url 'learning_logs:topics' %}">
                Explore My Curiosities
            </a>

        {% else %}

            <a class="btn btn-primary btn-lg"
               href="{% url 'accounts:register' %}">
                Start Exploring
            </a>

        {% endif %}

    </div>

</div>

{% endblock content %}
